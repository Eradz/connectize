<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Endpoint Testing</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        .endpoint {
            margin: 20px 0;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 5px;
            background: #f9f9f9;
        }
        .success {
            background: #d4edda;
            border-color: #c3e6cb;
        }
        .error {
            background: #f8d7da;
            border-color: #f5c6cb;
        }
        .loading {
            background: #d1ecf1;
            border-color: #bee5eb;
        }
        pre {
            background: #f8f9fa;
            padding: 10px;
            border-radius: 3px;
            overflow-x: auto;
            max-height: 300px;
        }
        button {
            background: #007bff;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 3px;
            cursor: pointer;
            margin: 5px;
        }
        button:hover {
            background: #0056b3;
        }
        button:disabled {
            background: #6c757d;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <h1>Subscription API Endpoint Testing</h1>
    
    <div>
        <button onclick="testAuth()">1. Test Authentication</button>
        <button onclick="testAllEndpoints()" id="testAllBtn" disabled>2. Test All Endpoints</button>
        <button onclick="clearResults()">Clear Results</button>
    </div>
    
    <div id="results"></div>

    <script>
        const API_BASE = 'http://127.0.0.1:8000';
        let authToken = null;
        
        const endpoints = [
            { name: 'Current Subscription', url: '/api/v1/subscriptions/current/' },
            { name: 'Plans', url: '/api/v1/plans/' },
            { name: 'Available Features', url: '/api/permissions/features/available/' },
            { name: 'Usage', url: '/api/v1/subscriptions/usage/' },
            { name: 'Analytics', url: '/api/v1/subscriptions/analytics/' },
            { name: 'Billing History', url: '/api/v1/subscriptions/billing_history/' },
            { name: 'Usage History', url: '/api/v1/subscriptions/usage_history/' },
            { name: 'Detailed Analytics', url: '/api/v1/subscriptions/detailed_analytics/' }
        ];

        function log(message, type = 'info') {
            const resultsDiv = document.getElementById('results');
            const timestamp = new Date().toLocaleTimeString();
            resultsDiv.innerHTML += `
                <div class="endpoint ${type}">
                    <strong>[${timestamp}]</strong> ${message}
                </div>
            `;
            console.log(message);
        }

        function showEndpointResult(name, data, status = 'success') {
            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML += `
                <div class="endpoint ${status}">
                    <h3>${name}</h3>
                    <pre>${JSON.stringify(data, null, 2)}</pre>
                </div>
            `;
        }

        async function testAuth() {
            log('Testing authentication with info@connectize.co...', 'loading');
            
            try {
                const response = await fetch(`${API_BASE}/api/auth/login/`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        email: 'info@connectize.co',
                        password: 'Access2024'
                    })
                });

                const data = await response.json();
                
                if (response.ok && data.success) {
                    authToken = data.token;
                    localStorage.setItem('user_session', JSON.stringify({
                        user: data.user,
                        token: data.token,
                        isAuthenticated: true
                    }));
                    
                    log('✅ Authentication successful!', 'success');
                    document.getElementById('testAllBtn').disabled = false;
                    showEndpointResult('Authentication Response', data, 'success');
                } else {
                    log(`❌ Authentication failed: ${data.message || 'Unknown error'}`, 'error');
                    showEndpointResult('Authentication Error', data, 'error');
                }
            } catch (error) {
                log(`❌ Authentication error: ${error.message}`, 'error');
                showEndpointResult('Authentication Error', {error: error.message}, 'error');
            }
        }

        async function testAllEndpoints() {
            if (!authToken) {
                log('❌ Please authenticate first', 'error');
                return;
            }

            log('🔄 Testing all subscription endpoints...', 'loading');

            for (const endpoint of endpoints) {
                try {
                    log(`Testing ${endpoint.name}...`, 'loading');
                    
                    const response = await fetch(`${API_BASE}${endpoint.url}`, {
                        headers: {
                            'Authorization': `Bearer ${authToken}`,
                            'Content-Type': 'application/json',
                        }
                    });

                    const data = await response.json();

                    if (response.ok) {
                        log(`✅ ${endpoint.name}: Success (${response.status})`, 'success');
                        showEndpointResult(endpoint.name, data, 'success');
                    } else {
                        log(`❌ ${endpoint.name}: Failed (${response.status})`, 'error');
                        showEndpointResult(`${endpoint.name} Error`, data, 'error');
                    }
                } catch (error) {
                    log(`❌ ${endpoint.name}: ${error.message}`, 'error');
                    showEndpointResult(`${endpoint.name} Error`, {error: error.message}, 'error');
                }
                
                // Small delay between requests
                await new Promise(resolve => setTimeout(resolve, 200));
            }

            log('🏁 All endpoint tests completed', 'success');
        }

        function clearResults() {
            document.getElementById('results').innerHTML = '';
            authToken = null;
            document.getElementById('testAllBtn').disabled = true;
            localStorage.removeItem('user_session');
        }

        // Check if already authenticated
        window.onload = function() {
            const session = JSON.parse(localStorage.getItem('user_session') || '{}');
            if (session.token) {
                authToken = session.token;
                document.getElementById('testAllBtn').disabled = false;
                log(`Using existing authentication for ${session.user?.email}`, 'success');
            }
        };
    </script>
</body>
</html>
