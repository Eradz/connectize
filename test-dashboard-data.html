<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Data Test</title>
</head>
<body>
    <h1>Dashboard Analytics Test</h1>
    <div id="results"></div>

    <script>
        // Mock the exact subscription data structure from our API test
        const mockSubscription = {
            plan: {
                name: "Enterprise",
                max_api_calls_per_month: 200000,
                max_posts_per_month: 1000,
                max_storage_gb: 200
            },
            status: "active",
            current_period_end: "2025-09-18T08:12:30.500668Z",
            api_calls_this_month: 0,
            posts_this_month: 0,
            storage_used_gb: 0.00,
            usage_summary: {
                api_calls: {
                    used: 0,
                    limit: 200000,
                    percentage: 0
                },
                posts: {
                    used: 0,
                    limit: 1000,
                    percentage: 0
                },
                storage: {
                    used_gb: 0.00,
                    limit_gb: 200,
                    percentage: 0
                }
            }
        };

        // Test our dashboard calculations
        function testDashboardData(subscription) {
            console.log('Testing dashboard data with:', subscription);
            
            // Total Usage calculation
            const usageData = subscription.usage_summary;
            const usageEntries = Object.values(usageData);
            const totalPercentage = usageEntries.reduce((sum, item) => sum + (item.percentage || 0), 0) / usageEntries.length;
            
            // Days remaining calculation
            const endDate = new Date(subscription.current_period_end);
            const now = new Date();
            const diffTime = endDate - now;
            const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
            
            // Next billing date
            const nextBilling = subscription.status === 'active' && subscription.current_period_end 
                ? new Date(subscription.current_period_end).toLocaleDateString()
                : 'N/A';
            
            return {
                planName: subscription.plan.name,
                status: subscription.status,
                nextBilling: nextBilling,
                totalUsage: totalPercentage.toFixed(1) + '%',
                usageTrend: 'Optimal',
                efficiencyScore: '85/100',
                daysRemaining: diffDays > 0 ? diffDays.toString() : '0',
                usageBreakdown: usageData
            };
        }

        const result = testDashboardData(mockSubscription);
        
        document.getElementById('results').innerHTML = `
            <h2>Dashboard Test Results</h2>
            <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; margin: 20px 0;">
                <div style="border: 1px solid #ccc; padding: 15px; border-radius: 8px;">
                    <h3>Plan Overview</h3>
                    <p><strong>Plan Name:</strong> ${result.planName}</p>
                    <p><strong>Status:</strong> ${result.status}</p>
                    <p><strong>Next Billing:</strong> ${result.nextBilling}</p>
                </div>
                
                <div style="border: 1px solid #ccc; padding: 15px; border-radius: 8px;">
                    <h3>Usage Analytics</h3>
                    <p><strong>Total Usage:</strong> ${result.totalUsage}</p>
                    <p><strong>Usage Trend:</strong> ${result.usageTrend}</p>
                    <p><strong>Efficiency Score:</strong> ${result.efficiencyScore}</p>
                    <p><strong>Days Remaining:</strong> ${result.daysRemaining}</p>
                </div>
            </div>
            
            <div style="border: 1px solid #ccc; padding: 15px; border-radius: 8px; margin-top: 20px;">
                <h3>Current Period Usage</h3>
                ${Object.entries(result.usageBreakdown).map(([key, usage]) => `
                    <div style="margin: 10px 0;">
                        <strong>${key.replace('_', ' ')}:</strong> ${usage.used} / ${usage.limit} (${usage.percentage}%)
                        <div style="background: #f0f0f0; height: 10px; border-radius: 5px; margin: 5px 0;">
                            <div style="background: #4CAF50; height: 100%; width: ${usage.percentage}%; border-radius: 5px;"></div>
                        </div>
                    </div>
                `).join('')}
            </div>
            
            <div style="margin-top: 20px; padding: 10px; background: #e8f5e8; border-radius: 8px;">
                <h3>Expected vs Current</h3>
                <p>✅ <strong>Plan Name:</strong> Should show "Enterprise" instead of "N/A"</p>
                <p>✅ <strong>Next Billing:</strong> Should show "9/18/2025" instead of "N/A"</p>
                <p>✅ <strong>Total Usage:</strong> Should show "0.0%" instead of "N/A"</p>
                <p>✅ <strong>Days Remaining:</strong> Should show "27" instead of "N/A"</p>
                <p>✅ <strong>Usage Data:</strong> Should show actual metrics instead of "No Usage Data"</p>
            </div>
        `;
    </script>
</body>
</html>
