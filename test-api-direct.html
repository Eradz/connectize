<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Subscription API Response</title>
</head>
<body>
    <h1>Subscription API Test</h1>
    <div id="results"></div>

    <script>
        async function testAPI() {
            try {
                console.log('Testing subscription API...');
                
                const response = await fetch('http://localhost:8000/api/v1/subscriptions/current/', {
                    headers: {
                        'Content-Type': 'application/json',
                        // Add any auth headers if needed
                    }
                });
                
                console.log('Response status:', response.status);
                
                if (response.ok) {
                    const data = await response.json();
                    console.log('Full API response:', data);
                    
                    document.getElementById('results').innerHTML = `
                        <h2>API Response</h2>
                        <p><strong>Status:</strong> ${response.status}</p>
                        <h3>Subscription Data:</h3>
                        <p><strong>Next Payment Date:</strong> ${data.subscription?.next_payment_date || 'null'}</p>
                        <p><strong>Current Period End:</strong> ${data.subscription?.current_period_end || 'null'}</p>
                        <p><strong>Status:</strong> ${data.subscription?.status || 'null'}</p>
                        <h3>Usage Data:</h3>
                        <p><strong>Next Billing Date:</strong> ${data.usage?.next_billing_date || 'null'}</p>
                        <h3>Raw Response:</h3>
                        <pre>${JSON.stringify(data, null, 2)}</pre>
                    `;
                } else {
                    document.getElementById('results').innerHTML = `
                        <h2>Error</h2>
                        <p>Status: ${response.status}</p>
                        <p>Response: ${await response.text()}</p>
                    `;
                }
            } catch (error) {
                console.error('Error:', error);
                document.getElementById('results').innerHTML = `
                    <h2>Error</h2>
                    <p>${error.message}</p>
                `;
            }
        }

        // Test on page load
        testAPI();
    </script>
</body>
</html>
