<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Test - Connectize</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background: #f5f5f5; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; }
        .test-section { margin: 20px 0; padding: 15px; border: 1px solid #ddd; border-radius: 5px; }
        .success { background: #e8f5e8; border-color: #4caf50; }
        .error { background: #ffebee; border-color: #f44336; }
        .loading { background: #e3f2fd; border-color: #2196f3; }
        pre { background: #f8f8f8; padding: 10px; border-radius: 4px; overflow-x: auto; }
        button { padding: 8px 16px; margin: 5px; border: none; border-radius: 4px; cursor: pointer; }
        .btn-primary { background: #2196f3; color: white; }
        .btn-success { background: #4caf50; color: white; }
        .btn-warning { background: #ff9800; color: white; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔧 Connectize API Test</h1>
        
        <div class="test-section">
            <h3>Step 1: Authentication Test</h3>
            <button class="btn-primary" onclick="testLogin()">Test Login</button>
            <button class="btn-warning" onclick="clearTokens()">Clear Tokens</button>
            <div id="auth-result"></div>
        </div>
        
        <div class="test-section">
            <h3>Step 2: Set Tokens Manually</h3>
            <button class="btn-success" onclick="setKnownTokens()">Set Working Tokens</button>
            <div id="token-result"></div>
        </div>
        
        <div class="test-section">
            <h3>Step 3: Test Logistics APIs</h3>
            <button class="btn-primary" onclick="testShipments()">Test Shipments</button>
            <button class="btn-primary" onclick="testInventory()">Test Inventory</button>
            <button class="btn-primary" onclick="testRequests()">Test Requests</button>
            <div id="api-result"></div>
        </div>
        
        <div class="test-section">
            <h3>Step 4: Frontend API Test</h3>
            <button class="btn-success" onclick="testFrontendAPI()">Test Frontend APIs</button>
            <div id="frontend-result"></div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://127.0.0.1:8000';
        const WORKING_TOKEN = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ0b2tlbl90eXBlIjoiYWNjZXNzIiwiZXhwIjoxNzU3MTIxMTA4LCJpYXQiOjE3NTU5MTE1MDgsImp0aSI6ImY5NDRhY2Y2ZTBjYTQxOTk5ODUzMzY5NzM2ODZmN2ExIiwidXNlcl9pZCI6MX0.FMFz8DlyGXpMhMYs0JVpXff8b6hnH99BDJYlLA9flgM';
        const REFRESH_TOKEN = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ0b2tlbl90eXBlIjoicmVmcmVzaCIsImV4cCI6MTc1NzEyMTEwOCwiaWF0IjoxNzU1OTExNTA4LCJqdGkiOiJiZTYxNTdkYWE4YjI0NmU2YjY1Zjc0ZjExYjI4YTNiMSIsInVzZXJfaWQiOjF9.HFmML3Ui6h6cK-yg80_ScojKPnNIOELb0du_mEcSPPc';

        async function testLogin() {
            const resultDiv = document.getElementById('auth-result');
            resultDiv.innerHTML = '<div class="loading">🔄 Testing login...</div>';
            
            try {
                const response = await fetch(`${API_BASE}/api/auth/login/`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email: 'info@connectize.co',
                        password: 'Access2024'
                    })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    resultDiv.innerHTML = `<div class="success">✅ Login successful!<pre>${JSON.stringify(data, null, 2)}</pre></div>`;
                    
                    // Auto-set tokens
                    const tokens = data.results.tokens;
                    localStorage.setItem('access', tokens.access);
                    localStorage.setItem('refresh', tokens.refresh);
                    localStorage.setItem('refresh_token', tokens.refresh);
                    
                } else {
                    resultDiv.innerHTML = `<div class="error">❌ Login failed<pre>${JSON.stringify(data, null, 2)}</pre></div>`;
                }
            } catch (error) {
                resultDiv.innerHTML = `<div class="error">❌ Login error: ${error.message}</div>`;
            }
        }

        function setKnownTokens() {
            localStorage.setItem('access', WORKING_TOKEN);
            localStorage.setItem('refresh', REFRESH_TOKEN);
            localStorage.setItem('refresh_token', REFRESH_TOKEN);
            
            const sessionData = {
                tokens: { access: WORKING_TOKEN, refresh: REFRESH_TOKEN },
                user: { id: 1, email: 'info@connectize.co' }
            };
            localStorage.setItem('connectize_session', JSON.stringify(sessionData));
            
            document.getElementById('token-result').innerHTML = '<div class="success">✅ Tokens set in localStorage</div>';
        }

        function clearTokens() {
            ['access', 'refresh', 'refresh_token', 'connectize_session'].forEach(key => {
                localStorage.removeItem(key);
                sessionStorage.removeItem(key);
            });
            document.getElementById('token-result').innerHTML = '<div class="loading">🗑️ Tokens cleared</div>';
        }

        async function testShipments() {
            await testAPI('/api/v1/logistics/shipments/', 'Shipments');
        }

        async function testInventory() {
            await testAPI('/api/v1/logistics/inventory-items/', 'Inventory');
        }

        async function testRequests() {
            await testAPI('/api/v1/logistics/requests/', 'Requests');
        }

        async function testAPI(endpoint, name) {
            const resultDiv = document.getElementById('api-result');
            resultDiv.innerHTML = `<div class="loading">🔄 Testing ${name} API...</div>`;
            
            const token = localStorage.getItem('access');
            if (!token) {
                resultDiv.innerHTML = '<div class="error">❌ No access token found. Please login first.</div>';
                return;
            }
            
            try {
                const response = await fetch(`${API_BASE}${endpoint}`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    resultDiv.innerHTML = `<div class="success">✅ ${name} API successful! Count: ${data.count || 'N/A'}<pre>${JSON.stringify(data, null, 2).substring(0, 500)}...</pre></div>`;
                } else {
                    resultDiv.innerHTML = `<div class="error">❌ ${name} API failed (${response.status})<pre>${JSON.stringify(data, null, 2)}</pre></div>`;
                }
            } catch (error) {
                resultDiv.innerHTML = `<div class="error">❌ ${name} API error: ${error.message}</div>`;
            }
        }

        async function testFrontendAPI() {
            const resultDiv = document.getElementById('frontend-result');
            resultDiv.innerHTML = '<div class="loading">🔄 Testing frontend APIs...</div>';
            
            try {
                // Import the frontend logistics API (this won't work in this standalone page, but shows the concept)
                resultDiv.innerHTML = '<div class="loading">ℹ️ Frontend API test requires the React app context. Check browser console in the main app.</div>';
            } catch (error) {
                resultDiv.innerHTML = `<div class="error">❌ Frontend API error: ${error.message}</div>`;
            }
        }

        // Auto-run initial checks
        window.onload = function() {
            const hasTokens = localStorage.getItem('access');
            if (hasTokens) {
                document.getElementById('token-result').innerHTML = '<div class="success">ℹ️ Existing tokens found in localStorage</div>';
            }
        };
    </script>
</body>
</html>
