name: Frontend quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: frontend-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Prepare evidence directory
        run: mkdir -p reports/quality
      - name: Enforce dependency risk budget
        run: |
          set +e
          node scripts/security-budget.mjs > reports/quality/security.json 2> reports/quality/security.stderr.log
          code=$?
          cat reports/quality/security.json
          cat reports/quality/security.stderr.log >&2
          echo "$code" > reports/quality/security.exit
          exit "$code"
      - name: Run SEO behavior tests
        run: |
          set +e
          npm run test:seo 2>&1 | tee reports/quality/seo.log
          code=${PIPESTATUS[0]}
          echo "$code" > reports/quality/seo.exit
          exit "$code"
      - name: Run PDF behavior tests
        run: |
          set +e
          npm run test:pdf 2>&1 | tee reports/quality/pdf.log
          code=${PIPESTATUS[0]}
          echo "$code" > reports/quality/pdf.exit
          exit "$code"
      - name: Build production application
        run: |
          set +e
          npm run build 2>&1 | tee reports/quality/build.log
          code=${PIPESTATUS[0]}
          echo "$code" > reports/quality/build.exit
          exit "$code"
      - name: Enforce bundle budgets
        run: |
          set +e
          node scripts/check-bundle-budget.mjs > reports/quality/bundle.json 2> reports/quality/bundle.stderr.log
          code=$?
          cat reports/quality/bundle.json
          cat reports/quality/bundle.stderr.log >&2
          echo "$code" > reports/quality/bundle.exit
          exit "$code"
      - name: Create quality evidence manifest
        if: always()
        run: npm run evidence:collect -- reports/quality/evidence.json
      - name: Retain quality evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-quality-evidence-${{ github.sha }}
          path: reports/quality
          if-no-files-found: error
          retention-days: 90
