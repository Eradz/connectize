name: Frontend quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: frontend-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Enforce dependency risk budget
        run: npm run security:budget
      - name: Run SEO behavior tests
        run: npm run test:seo
      - name: Build production application
        run: npm run build
      - name: Enforce bundle budgets
        run: npm run check:bundle
