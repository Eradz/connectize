<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Next Charge Date Fix</title>
</head>
<body>
    <h1>Next Charge Date Fix Test</h1>
    <p>This page tests the PaymentMethodManager component's date logic.</p>
    
    <div id="test-results"></div>

    <script>
        // Mock the subscription data based on our API response
        const mockSubscription = {
            next_payment_date: null,
            current_period_end: "2025-09-18T08:12:30.500668Z",
            next_billing_date: null,
            status: "active",
            billing_info: null
        };

        // Test the exact logic from PaymentMethodManager
        function testDateLogic(subscription) {
            console.log('🔍 Testing PaymentMethodManager subscription data:', {
                next_payment_date: subscription?.next_payment_date,
                current_period_end: subscription?.current_period_end,
                next_billing_date: subscription?.next_billing_date,
                status: subscription?.status,
                billing_info: subscription?.billing_info
            });
            
            // For active subscriptions, current_period_end is the next billing date
            if (subscription?.status === 'active' && subscription?.current_period_end) {
                console.log('✅ Using current_period_end for active subscription:', subscription.current_period_end);
                return new Date(subscription.current_period_end).toLocaleDateString();
            }
            
            // Try other possible date fields from API
            const nextDate = subscription?.next_payment_date || 
                           subscription?.next_billing_date ||
                           subscription?.billing_info?.next_payment_date ||
                           subscription?.billing_info?.next_billing_date;
            
            if (nextDate) {
                console.log('✅ Found next billing date:', nextDate);
                return new Date(nextDate).toLocaleDateString();
            }
            
            // For trial subscriptions, also use current_period_end
            if (subscription?.status === 'trialing' && subscription?.current_period_end) {
                console.log('✅ Using trial period end date:', subscription.current_period_end);
                return new Date(subscription.current_period_end).toLocaleDateString();
            }
            
            // If still no date and we have a trial period, estimate
            if (subscription?.status === 'trialing' && subscription?.current_period_start) {
                const startDate = new Date(subscription.current_period_start);
                const estimatedEnd = new Date(startDate);
                estimatedEnd.setMonth(estimatedEnd.getMonth() + 1); // Add 1 month
                console.log('⚠️ Using estimated date from trial start');
                return estimatedEnd.toLocaleDateString();
            }
            
            // Fallback to current_period_end regardless of status
            if (subscription?.current_period_end) {
                console.log('⚠️ Fallback: Using current_period_end:', subscription.current_period_end);
                return new Date(subscription.current_period_end).toLocaleDateString();
            }
            
            console.log('❌ No billing date found, showing N/A');
            return 'N/A';
        }

        // Run the test
        const result = testDateLogic(mockSubscription);
        
        document.getElementById('test-results').innerHTML = `
            <h2>Test Results</h2>
            <p><strong>Input Data:</strong></p>
            <pre>${JSON.stringify(mockSubscription, null, 2)}</pre>
            <p><strong>Next Charge Date Result:</strong> <span style="color: green; font-weight: bold;">${result}</span></p>
            <p><strong>Expected:</strong> 9/18/2025 (or similar format)</p>
            <p><strong>Status:</strong> ${result !== 'N/A' ? '✅ FIXED' : '❌ STILL BROKEN'}</p>
        `;
    </script>
</body>
</html>
