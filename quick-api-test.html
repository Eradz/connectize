<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quick API Test</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .result { background: #f0f0f0; padding: 10px; margin: 10px 0; border-radius: 5px; }
        .error { background: #ffe6e6; border: 1px solid #ff9999; }
        .success { background: #e6ffe6; border: 1px solid #99ff99; }
        pre { white-space: pre-wrap; word-wrap: break-word; }
    </style>
</head>
<body>
    <h1>Quick Subscription API Test</h1>
    
    <button onclick="testAuth()">1. Test Auth</button>
    <button onclick="testCurrentSubscription()">2. Test Current Subscription</button>
    <button onclick="testUsage()">3. Test Usage</button>
    
    <div id="results"></div>

    <script>
        const API_BASE = 'http://127.0.0.1:8000';
        let authToken = null;

        function log(content, type = 'result') {
            const div = document.createElement('div');
            div.className = `result ${type}`;
            div.innerHTML = content;
            document.getElementById('results').appendChild(div);
        }

        async function testAuth() {
            try {
                const response = await fetch(`${API_BASE}/api/auth/login/`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email: 'info@connectize.co',
                        password: 'Access2024'
                    })
                });

                const data = await response.json();
                if (response.ok && data.success) {
                    authToken = data.token;
                    log(`<h3>✅ Authentication Success</h3><pre>${JSON.stringify(data, null, 2)}</pre>`, 'success');
                } else {
                    log(`<h3>❌ Authentication Failed</h3><pre>${JSON.stringify(data, null, 2)}</pre>`, 'error');
                }
            } catch (error) {
                log(`<h3>❌ Auth Error</h3><pre>${error.message}</pre>`, 'error');
            }
        }

        async function testCurrentSubscription() {
            if (!authToken) {
                log('❌ Please authenticate first', 'error');
                return;
            }

            try {
                const response = await fetch(`${API_BASE}/api/v1/subscriptions/current/`, {
                    headers: {
                        'Authorization': `Bearer ${authToken}`,
                        'Content-Type': 'application/json'
                    }
                });

                const data = await response.json();
                if (response.ok) {
                    log(`<h3>✅ Current Subscription Data</h3><pre>${JSON.stringify(data, null, 2)}</pre>`, 'success');
                } else {
                    log(`<h3>❌ Subscription API Failed (${response.status})</h3><pre>${JSON.stringify(data, null, 2)}</pre>`, 'error');
                }
            } catch (error) {
                log(`<h3>❌ Subscription Error</h3><pre>${error.message}</pre>`, 'error');
            }
        }

        async function testUsage() {
            if (!authToken) {
                log('❌ Please authenticate first', 'error');
                return;
            }

            try {
                const response = await fetch(`${API_BASE}/api/v1/subscriptions/usage/`, {
                    headers: {
                        'Authorization': `Bearer ${authToken}`,
                        'Content-Type': 'application/json'
                    }
                });

                const data = await response.json();
                if (response.ok) {
                    log(`<h3>✅ Usage Data</h3><pre>${JSON.stringify(data, null, 2)}</pre>`, 'success');
                } else {
                    log(`<h3>❌ Usage API Failed (${response.status})</h3><pre>${JSON.stringify(data, null, 2)}</pre>`, 'error');
                }
            } catch (error) {
                log(`<h3>❌ Usage Error</h3><pre>${error.message}</pre>`, 'error');
            }
        }
    </script>
</body>
</html>
